<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SAVORIA | Reservation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: #0b0b0b;
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .navbar {
      max-width: 1150px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: #d9a441;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      list-style: none;
    }

    .nav-links a {
      color: #ddd;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #d9a441;
    }

    .cart-btn {
      background: #d9a441;
      color: #111;
      padding: 10px 17px;
      border-radius: 25px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background:
        linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
        url("https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1600&q=85")
        center/cover;
    }

    .hero small {
      color: #d9a441;
      letter-spacing: 4px;
    }

    .hero h1 {
      font-size: 50px;
      margin: 12px 0;
    }

    .hero p {
      color: #ccc;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 75px 20px;
    }

    .reservation-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 35px;
      align-items: stretch;
    }

    .info {
      background: #1b1b1b;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 35px;
    }

    .info small {
      color: #d9a441;
      letter-spacing: 3px;
    }

    .info h2 {
      font-size: 32px;
      margin: 12px 0 20px;
    }

    .info p {
      color: #999;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .info-item {
      display: flex;
      gap: 15px;
      margin: 20px 0;
    }

    .info-icon {
      font-size: 25px;
    }

    .info-item h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .info-item p {
      margin: 0;
      font-size: 14px;
    }

    .form-box {
      background: #1b1b1b;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 35px;
    }

    .form-box h2 {
      margin-bottom: 25px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #111;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d9a441;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: #d9a441;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #f0bd58;
    }

    .success {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 8px;
      background: #18351f;
      border: 1px solid #315f3b;
      color: #b9e5c2;
      text-align: center;
      line-height: 1.6;
    }

    footer {
      background: #0b0b0b;
      text-align: center;
      padding: 35px 20px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 800px) {

      .navbar {
        flex-direction: column;
      }

      .nav-links {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-links a {
        font-size: 12px;
      }

      .hero h1 {
        font-size: 40px;
      }

      .reservation-grid {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      <li><a href="reservation.html">Reservation</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <a href="cart.html" class="cart-btn">
      🛒 Cart

  </nav>

</header>
